name: Compilar y publicar

# Se ejecuta cuando subes cambios al launcher (o a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
    paths:
      - "launcher.py"
      - "requirements.txt"
      - "icon.ico"
      - "installer.iss"
      - "fonts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la versión
        id: ver
        shell: python
        run: |
          import os, re
          src = open("launcher.py", encoding="utf-8").read()
          v = re.search(r'LAUNCHER_VERSION = "([^"]+)"', src).group(1)
          nums = (re.findall(r"\d+", v) + ["0"] * 4)[:4]
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=" + v + "\n")
              out.write("fileversion=" + ".".join(nums) + "\n")

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt nuitka ordered-set zstandard

      - name: Compilar TOMATE77K con Nuitka
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads
          --windows-console-mode=disable --enable-plugin=pyside6
          --include-qt-plugins=platforms,styles,imageformats
          --windows-icon-from-ico=icon.ico
          --include-data-files=icon.ico=icon.ico --include-data-dir=fonts=fonts
          --include-package=minecraft_launcher_lib --include-package-data=certifi
          --include-package-data=minecraft_launcher_lib
          --company-name=Tomate77K --product-name=TOMATE77K --file-description=TOMATE77K
          --file-version=${{ steps.ver.outputs.fileversion }}
          --product-version=${{ steps.ver.outputs.fileversion }}
          --output-filename=TOMATE77K.exe --output-dir=dist launcher.py

      - name: Comprobar el resultado
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name
          if (!(Test-Path dist/launcher.dist/TOMATE77K.exe)) { Write-Error "No se creó dist/launcher.dist/TOMATE77K.exe"; exit 1 }

      - name: Compilar el instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publicar la release y actualizar latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "app-$v"
          $setup = "installer_out/TOMATE77K-setup.exe"
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $setupUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/TOMATE77K-setup.exe"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup --clobber
          } else {
            gh release create $tag $setup --title "TOMATE77K $v" --notes "Versión $v"
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # url/sha256 son para versiones antiguas del launcher (que reemplazaban el .exe). Ya no
          # existe un .exe suelto, así que el sha256 es intencionalmente falso: esas versiones
          # rechazan la descarga y siguen funcionando; deben instalar el nuevo instalador a mano.
          $json = [ordered]@{
            version          = $v
            url              = $setupUrl
            sha256           = ("0" * 64)
            installer_url    = $setupUrl
            installer_sha256 = $setupHash
          } | ConvertTo-Json
          Set-Content -Path latest.json -Value $json -Encoding utf8

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.json
          git commit -m "Actualizar latest.json a $v"
          # Si subiste algo al repo mientras el robot trabajaba, primero se pone al día
          git pull --rebase --autostash origin main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push
          if ($LASTEXITCODE -ne 0) { exit 1 }
