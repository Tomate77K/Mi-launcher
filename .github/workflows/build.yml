name: Compilar y publicar

# Se ejecuta cuando subes cambios al launcher (o a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
    paths:
      - "launcher.py"
      - "requirements.txt"
      - "icon.ico"
      - "installer.iss"
      - "fonts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leer la versión y actualizar version_info.txt
        id: ver
        shell: python
        run: |
          import os, re
          src = open("launcher.py", encoding="utf-8").read()
          v = re.search(r'LAUNCHER_VERSION = "([^"]+)"', src).group(1)
          nums = (re.findall(r"\d+", v) + ["0"] * 4)[:4]
          dotted = ".".join(nums)
          t = open("version_info.txt", encoding="utf-8").read()
          t = re.sub(r"(filevers|prodvers)=\([^)]*\)", lambda m: m.group(1) + "=(" + ", ".join(nums) + ")", t)
          t = re.sub(r"(StringStruct\('(?:FileVersion|ProductVersion)', ')[^']*(')", lambda m: m.group(1) + dotted + m.group(2), t)
          open("version_info.txt", "w", encoding="utf-8").write(t)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=" + v + "\n")

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compilar CLIENT77K.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onefile --name CLIENT77K
          --icon icon.ico --add-data "icon.ico;." --add-data "fonts;fonts"
          --version-file version_info.txt
          --collect-submodules minecraft_launcher_lib --collect-data certifi launcher.py

      - name: Compilar el instalador
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publicar la release y actualizar latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "app-$v"
          $hash = (Get-FileHash dist/CLIENT77K.exe -Algorithm SHA256).Hash.ToLower()

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/CLIENT77K.exe installer_out/CLIENT77K-setup.exe --clobber
          } else {
            gh release create $tag dist/CLIENT77K.exe installer_out/CLIENT77K-setup.exe --title "CLIENT77K $v" --notes "Versión $v"
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $json = [ordered]@{
            version = $v
            url     = "https://github.com/${{ github.repository }}/releases/download/$tag/CLIENT77K.exe"
            sha256  = $hash
          } | ConvertTo-Json
          Set-Content -Path latest.json -Value $json -Encoding utf8

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add latest.json
          git commit -m "Actualizar latest.json a $v"
          # Si subiste algo al repo mientras el robot trabajaba, primero se pone al día
          git pull --rebase --autostash origin main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push
          if ($LASTEXITCODE -ne 0) { exit 1 }
          
